<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>困难模式 - TagineLake</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23E52521'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white'>T</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/parkour.css">
  <link rel="stylesheet" href="../css/content.css">
  <link rel="stylesheet" href="../css/clouds.css">
</head>
<body>

  <!-- Parkour 背景 -->
  <div class="parkour-host">
    <canvas id="parkour-canvas"></canvas>
  </div>

  <!-- 左上角：返回首页 -->
  <a href="../index.html" class="corner-btn corner-back" title="返回首页">
    <span class="corner-ico">‹</span><span>返回</span>
  </a>
  <!-- 右上角：主菜单（与首页一致） -->
  <button class="corner-btn corner-menu" id="corner-menu" title="菜单">
    <span class="corner-ico">☰</span><span>菜单</span>
  </button>

  <!-- 内容（3 个信息栏，单页切换） -->
  <main class="page-content">

    <section class="content-section" id="sec-honors">
      <div class="section-head">
        <h1 class="page-title">个人荣誉</h1>
        <p class="page-subtitle">Honors & Awards</p>
      </div>
      <div class="section-body">
        <div class="honor-list" id="list-honors"></div>
      </div>
    </section>

    <section class="content-section" id="sec-works" style="display:none;">
      <div class="section-head">
        <h1 class="page-title">个人作品</h1>
        <p class="page-subtitle">My Works</p>
      </div>
      <div class="section-body">
        <div class="works-grid" id="list-works"></div>
      </div>
    </section>

    <section class="content-section" id="sec-abilities" style="display:none;">
      <div class="section-head">
        <h1 class="page-title">个人能力</h1>
        <p class="page-subtitle">Abilities · 4 级熟练度</p>
      </div>
      <div class="section-body">
        <div id="list-abilities" class="cloud-stage"></div>
      </div>
    </section>

  </main>

  <!-- 底部 3 段进度条 -->
  <div id="mini-progress" class="mini-progress"></div>

  <script src="../vendor/marked.min.js"></script>
  <script src="../js/parkour.js"></script>
  <script src="../js/content-render.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/page-core.js"></script>
</body>
</html>
