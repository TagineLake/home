<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单模式 - TagineLake</title>
  <meta name="description" content="TagineLake 的简单模式 - 浏览人生成就、生活动态和生活圈子">

  <meta property="og:title" content="简单模式 - TagineLake">
  <meta property="og:type" content="website">
  <meta property="og:description" content="浏览人生成就、生活动态和生活圈子">
  <meta property="og:image" content="../assets/images/og-cover.png">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23E52521'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white'>T</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/parkour.css">
  <link rel="stylesheet" href="../css/content.css">
  <link rel="stylesheet" href="../css/clouds.css">
</head>
<body>

  <div class="crt-overlay"></div>

  <!-- Parkour 背景 -->
  <div class="parkour-host">
    <canvas id="parkour-canvas"></canvas>
  </div>

  <!-- 左上角：返回首页 -->
  <a href="../index.html" class="corner-btn corner-back" title="返回首页">
    <span class="corner-ico">‹</span><span>返回</span>
  </a>
  <!-- 右上角：主菜单（与首页一致） -->
  <button class="corner-btn corner-menu" id="corner-menu" title="菜单">
    <span class="corner-ico">☰</span><span>菜单</span>
  </button>

  <!-- 内容（3 个信息栏，单页切换） -->
  <main class="page-content">

    <section class="content-section" id="sec-achievements">
      <div class="section-head">
        <h1 class="page-title">人生成就</h1>
        <p class="page-subtitle">Achievements of My Life</p>
      </div>
      <div class="section-body">
        <div class="achievement-grid" id="list-achievements"></div>
      </div>
    </section>

    <section class="content-section" id="sec-feed" style="display:none;">
      <div class="section-head">
        <h1 class="page-title">生活动态</h1>
        <p class="page-subtitle">Life Updates</p>
      </div>
      <div class="section-body">
        <div class="feed-list" id="list-feed"></div>
        <div class="comment-box card">
          <h3 class="comment-title">留言板</h3>
          <form id="comment-form" class="comment-form">
            <div class="cf-row">
              <input id="c-name" class="cf-input" placeholder="真实姓名 *" required>
              <input id="c-wechat" class="cf-input" placeholder="微信号（与 QQ 二选一）">
              <input id="c-qq" class="cf-input" placeholder="QQ 号（与微信号二选一）">
            </div>
            <textarea id="c-content" class="cf-input" rows="3" placeholder="说点什么…（必填）" required></textarea>
            <div class="comment-actions">
              <button id="c-submit" type="submit" class="mario-btn mario-btn--small">发送</button>
              <span id="c-status" class="comment-status"></span>
            </div>
          </form>
          <div id="c-list" class="comment-list"></div>
        </div>
      </div>
    </section>

    <section class="content-section" id="sec-circles" style="display:none;">
      <div class="section-head">
        <h1 class="page-title">生活圈子</h1>
        <p class="page-subtitle">My Circles</p>
      </div>
      <div class="section-body">
        <div id="list-circles"></div>
      </div>
    </section>

  </main>

  <!-- 底部 3 段进度条 -->
  <div id="mini-progress" class="mini-progress"></div>

  <script src="../vendor/marked.min.js"></script>
  <script src="../js/parkour.js"></script>
  <script src="../js/content-render.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/page-core.js"></script>
  <script src="../js/comments.js"></script>
</body>
</html>
